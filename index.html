<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AURA IoT | ESP32 Command Center</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>

  <style>
    :root {
      --bg-dark: #070a12;
      --card-bg: rgba(15, 23, 42, 0.75);
      --border-color: rgba(255, 255, 255, 0.08);
      --primary-cyan: #06b6d4;
      --accent-green: #10b981;
      --accent-red: #f43f5e;
      --text-muted: #64748b;
      --text-main: #f8fafc;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container { width: 100%; max-width: 1050px; }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      padding: 16px 24px;
      border-radius: 20px;
      margin-bottom: 24px;
    }

    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-logo {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--primary-cyan), var(--accent-green));
      border-radius: 10px; display: flex; justify-content: center; align-items: center;
      font-weight: 700; color: #000; font-size: 18px;
    }
    .brand-title { font-size: 18px; font-weight: 700; }
    .brand-subtitle { font-size: 11px; color: var(--text-muted); text-transform: uppercase; }

    .server-status {
      display: flex; align-items: center; gap: 10px;
      background: rgba(255, 255, 255, 0.04); padding: 8px 16px;
      border-radius: 100px; border: 1px solid var(--border-color);
      font-size: 13px; font-weight: 600;
    }

    .status-dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--accent-red); box-shadow: 0 0 10px var(--accent-red);
      transition: all 0.3s ease;
    }

    .status-dot.active {
      background: var(--accent-green); box-shadow: 0 0 12px var(--accent-green);
    }

    .grid-dashboard {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px;
    }

    .card {
      background: var(--card-bg); backdrop-filter: blur(16px);
      border: 1px solid var(--border-color); border-radius: 24px; padding: 24px;
      display: flex; flex-direction: column;
    }

    .card-title {
      font-size: 14px; text-transform: uppercase; color: var(--text-muted);
      margin-bottom: 20px; font-weight: 700; display: flex; justify-content: space-between;
    }

    .led-display-container {
      display: flex; flex-direction: column; align-items: center; padding: 20px 0;
    }

    .led-bulb-glow {
      width: 120px; height: 120px; border-radius: 50%; background: #1e293b;
      border: 3px solid rgba(255, 255, 255, 0.05); display: flex;
      justify-content: center; align-items: center; margin-bottom: 24px;
      transition: all 0.4s ease; box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.8);
    }

    .led-bulb-glow svg { width: 54px; height: 54px; fill: #475569; transition: all 0.4s ease; }

    .led-bulb-glow.active {
      background: var(--accent-green); border-color: #4ade80;
      box-shadow: 0 0 60px rgba(16, 185, 129, 0.6), inset 0 0 20px rgba(255, 255, 255, 0.8);
    }
    .led-bulb-glow.active svg { fill: #ffffff; }

    .btn-control-group { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; }

    .btn-cmd {
      border: none; padding: 16px; border-radius: 14px; font-family: inherit;
      font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.2s ease;
    }
    .btn-cmd:active { transform: scale(0.95); }
    .btn-on { background: var(--accent-green); color: #022c22; }
    .btn-off { background: rgba(244, 63, 94, 0.15); color: var(--accent-red); border: 1px solid rgba(244, 63, 94, 0.3); }

    .terminal-window {
      background: #020617; border: 1px solid var(--border-color);
      border-radius: 14px; padding: 14px; font-family: 'JetBrains Mono', monospace;
      font-size: 12px; height: 180px; overflow-y: auto; display: flex;
      flex-direction: column; gap: 8px;
    }

    .log-entry { line-height: 1.4; }
    .log-time { color: var(--text-muted); }
    .log-success { color: var(--accent-green); }
    .log-info { color: var(--primary-cyan); }
    .log-warn { color: var(--accent-red); }
  </style>
</head>
<body>

  <div class="container">
    <header class="navbar">
      <div class="brand">
        <div class="brand-logo">ESP</div>
        <div>
          <div class="brand-title">AURA IoT OS</div>
          <div class="brand-subtitle">Smart Device Telemetry</div>
        </div>
      </div>
      <div class="server-status">
        <div id="statusDot" class="status-dot"></div>
        <span id="statusText">ESP32 OFFLINE</span>
      </div>
    </header>

    <main class="grid-dashboard">
      <section class="card">
        <div class="card-title">
          <span>Primary Control</span>
          <span style="font-size: 10px; color: var(--primary-cyan);">GPIO 02</span>
        </div>

        <div class="led-display-container">
          <div id="bulbGlow" class="led-bulb-glow">
            <svg viewBox="0 0 24 24">
              <path d="M12 2A7 7 0 0 0 5 9c0 2.38 1.19 4.47 3 5.74V17a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.26c1.81-1.27 3-3.36 3-5.74a7 7 0 0 0-7-7M9 21a1 1 0 0 0 1 1h4a1 1 0 0 0 1-1v-1H9v1z"/>
            </svg>
          </div>
          <div id="stateText" style="font-size:18px; font-weight:700; color:var(--text-muted);">STANDBY</div>
        </div>

        <div class="btn-control-group">
          <button class="btn-cmd btn-on" onclick="sendMQTT('ON')">POWER ON</button>
          <button class="btn-cmd btn-off" onclick="sendMQTT('OFF')">POWER OFF</button>
        </div>
      </section>

      <section class="card">
        <div class="card-title">Real-Time Terminal Log</div>
        <div id="terminal" class="terminal-window">
          <div class="log-entry log-info">[SYSTEM] Waiting for ESP32 Signal...</div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const BROKER = 'wss://broker.emqx.io:8084/mqtt';
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const bulbGlow = document.getElementById('bulbGlow');
    const stateText = document.getElementById('stateText');
    const terminal = document.getElementById('terminal');

    let espOnline = false;
    const clientId = 'web_dashboard_' + Math.random().toString(16).substr(2, 8);
    const client = mqtt.connect(BROKER, { clientId: clientId, keepalive: 60 });

    function writeLog(msg, type = 'info') {
      const timeStr = new Date().toLocaleTimeString();
      const logLine = document.createElement('div');
      logLine.className = `log-entry log-${type}`;
      logLine.innerHTML = `<span class="log-time">[${timeStr}]</span> ${msg}`;
      terminal.appendChild(logLine);
      terminal.scrollTop = terminal.scrollHeight;
    }

    client.on('connect', () => {
      writeLog('Terhubung ke Server MQTT. Mendengarkan status ESP32...', 'info');
      // Subscribe status koneksi dan feedback dari ESP32
      client.subscribe('anang_test_iot/status');
      client.subscribe('anang_test_iot/led_state');
    });

    // Menerima pesan balasan dari ESP32
    client.on('message', (topic, payload) => {
      const msg = payload.toString();

      if (topic === 'anang_test_iot/status') {
        if (msg === 'ONLINE') {
          espOnline = true;
          statusText.innerText = 'ESP32 ONLINE';
          statusDot.classList.add('active');
          writeLog('ESP32 Terdeteksi ONLINE!', 'success');
        } else {
          espOnline = false;
          statusText.innerText = 'ESP32 OFFLINE';
          statusDot.classList.remove('active');
          bulbGlow.classList.remove('active');
          stateText.innerText = 'OFFLINE';
          stateText.style.color = 'var(--text-muted)';
          writeLog('ESP32 Terputus / OFFLINE!', 'warn');
        }
      }

      if (topic === 'anang_test_iot/led_state') {
        if (msg === 'ON') {
          bulbGlow.classList.add('active');
          stateText.innerText = 'LED ACTIVE';
          stateText.style.color = 'var(--accent-green)';
          writeLog('Konfirmasi dari ESP32: Lampu Fisik NYALA', 'success');
        } else if (msg === 'OFF') {
          bulbGlow.classList.remove('active');
          stateText.innerText = 'LED INACTIVE';
          stateText.style.color = 'var(--accent-red)';
          writeLog('Konfirmasi dari ESP32: Lampu Fisik MATI', 'warn');
        }
      }
    });

    function sendMQTT(command) {
      if (!espOnline) {
        alert('Gagal! ESP32 sedang OFFLINE. Pastikan alat menyala.');
        return;
      }
      client.publish('anang_test_iot/led', command);
      writeLog(`Mengirim perintah: ${command}...`, 'info');
    }
  </script>
</body>
</html>
