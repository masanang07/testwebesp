<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>exWann Music Player</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#070a12">

  <!-- Google Fonts & Phosphor Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <style>
    :root {
      --bg-dark: #070a12;
      --card-bg: rgba(15, 23, 42, 0.85);
      --border-color: rgba(255, 255, 255, 0.1);
      --primary-cyan: #06b6d4;
      --accent-green: #10b981;
      --text-muted: #94a3b8;
      --text-main: #f8fafc;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 20% 20%, rgba(6, 182, 212, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(16, 185, 129, 0.12) 0%, transparent 50%);
      color: var(--text-main);
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .player-card {
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      border: 1px solid var(--border-color);
      border-radius: 32px;
      padding: 28px 24px;
      width: 100%;
      max-width: 390px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .app-brand {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--primary-cyan);
      margin-bottom: 20px;
    }

    /* Search Box */
    .search-box {
      width: 100%;
      display: flex;
      gap: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 8px 12px;
      margin-bottom: 16px;
      transition: border-color 0.2s;
    }

    .search-box:focus-within {
      border-color: var(--primary-cyan);
    }

    .search-box input {
      flex: 1;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 13px;
      font-family: inherit;
      outline: none;
    }

    .search-box button {
      background: var(--primary-cyan);
      border: none;
      color: #000;
      width: 32px;
      height: 32px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: transform 0.2s;
    }

    .search-box button:active { transform: scale(0.9); }

    /* Hasil Pencarian */
    .search-results {
      width: 100%;
      max-height: 180px;
      overflow-y: auto;
      margin-bottom: 16px;
      display: none;
      flex-direction: column;
      gap: 8px;
      padding-right: 4px;
    }

    .result-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.03);
      padding: 8px 10px;
      border-radius: 12px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background 0.2s, border-color 0.2s;
    }

    .result-item:hover {
      background: rgba(6, 182, 212, 0.1);
      border-color: rgba(6, 182, 212, 0.3);
    }

    .result-thumb {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      object-fit: cover;
    }

    .result-details {
      flex: 1;
      overflow: hidden;
    }

    .result-title {
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .result-artist {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Player Interface */
    .cover-art-container {
      position: relative;
      width: 180px;
      height: 180px;
      margin-bottom: 20px;
    }

    .cover-art {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      animation: spin 20s linear infinite;
      animation-play-state: paused;
    }

    .cover-art.playing { animation-play-state: running; }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .track-info {
      text-align: center;
      margin-bottom: 16px;
      width: 100%;
    }

    .track-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .progress-container {
      width: 100%;
      margin-bottom: 20px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 100px;
      cursor: pointer;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary-cyan), var(--accent-green));
      border-radius: 100px;
      transition: width 0.1s linear;
    }

    .time-stamps {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 8px;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      width: 100%;
    }

    .btn-ctrl {
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 24px;
      cursor: pointer;
      transition: transform 0.2s ease, color 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-ctrl:active { transform: scale(0.9); }
    .btn-ctrl:hover { color: var(--primary-cyan); }

    .btn-play {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary-cyan), var(--accent-green));
      color: #000;
      font-size: 28px;
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.4);
    }

    .btn-play:hover {
      color: #000;
      transform: scale(1.05);
    }

    #ytPlayerHidden {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="player-card">
    <div class="app-brand">exWann Music</div>

    <!-- Kolom Cari Lagu / Paste Link YouTube -->
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Cari judul lagu / paste link YT..." onkeypress="handleSearchKey(event)">
      <button onclick="searchMusic()"><i class="ph-bold ph-magnifying-glass"></i></button>
    </div>

    <!-- Hasil Pencarian -->
    <div id="searchResults" class="search-results"></div>

    <div class="cover-art-container">
      <img id="coverArt" class="cover-art" src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=500&q=80" alt="Album Cover">
    </div>

    <div class="track-info">
      <div id="trackTitle" class="track-title">Cari lagu di atas ☝️</div>
      <div id="trackArtist" class="track-artist">exWann Audio</div>
    </div>

    <div class="progress-container">
      <div class="progress-bar-bg" id="progressBar" onclick="seekTrack(event)">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="time-stamps">
        <span id="currentTime">0:00</span>
        <span id="duration">0:00</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn-ctrl" onclick="prevTrack()"><i class="ph-bold ph-skip-back"></i></button>
      <button id="playBtn" class="btn-ctrl btn-play" onclick="togglePlay()"><i class="ph-bold ph-play"></i></button>
      <button class="btn-ctrl" onclick="nextTrack()"><i class="ph-bold ph-skip-forward"></i></button>
    </div>
  </div>

  <div id="ytPlayerHidden"></div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    let playlist = [
      {
        title: "Membasuh",
        artist: "Hindia",
        ytId: "u_qN2C50K6E",
        cover: "https://img.youtube.com/vi/u_qN2C50K6E/hqdefault.jpg"
      }
    ];

    let currentTrackIndex = 0;
    let ytPlayer = null;
    let isPlaying = false;
    let progressInterval = null;

    const coverArt = document.getElementById('coverArt');
    const trackTitle = document.getElementById('trackTitle');
    const trackArtist = document.getElementById('trackArtist');
    const playBtn = document.getElementById('playBtn');
    const progressFill = document.getElementById('progressFill');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');
    const searchResults = document.getElementById('searchResults');

    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('ytPlayerHidden', {
        height: '100',
        width: '100',
        videoId: playlist[0].ytId,
        playerVars: { 'playsinline': 1, 'controls': 0 },
        events: {
          'onReady': () => loadTrack(0, false),
          'onStateChange': onPlayerStateChange
        }
      });
    }

    // Sistem Search dengan Multi-Server Fallback
    async function searchMusic() {
      const query = document.getElementById('searchInput').value.trim();
      if (!query) return;

      // Fitur Deteksi Paste Link Direct Youtube
      if (query.includes('youtube.com/') || query.includes('youtu.be/')) {
        let videoId = '';
        if (query.includes('v=')) {
          videoId = query.split('v=')[1].split('&')[0];
        } else if (query.includes('youtu.be/')) {
          videoId = query.split('youtu.be/')[1].split('?')[0];
        }
        if (videoId) {
          selectAndPlaySong("Lagu YouTube", "exWann Music", videoId, `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`);
          return;
        }
      }

      searchResults.style.display = 'flex';
      searchResults.innerHTML = '<div style="font-size:12px; color:var(--primary-cyan); text-align:center; padding:10px;">Mencari di YouTube...</div>';

      // Daftar 3 Server Cadangan
      const servers = [
        {
          url: q => `https://api.piped.video/search?q=${encodeURIComponent(q)}&filter=music_songs`,
          parse: data => data.items.filter(i => i.type === 'stream').map(i => ({
            title: i.title,
            artist: i.uploaderName || 'YouTube Artist',
            id: i.url.split('v=')[1],
            thumb: i.thumbnail
          }))
        },
        {
          url: q => `https://yewtu.be/api/v1/search?q=${encodeURIComponent(q)}&type=video`,
          parse: data => data.map(i => ({
            title: i.title,
            artist: i.author || 'YouTube Artist',
            id: i.videoId,
            thumb: `https://img.youtube.com/vi/${i.videoId}/hqdefault.jpg`
          }))
        },
        {
          url: q => `https://invidious.nerdvpn.de/api/v1/search?q=${encodeURIComponent(q)}&type=video`,
          parse: data => data.map(i => ({
            title: i.title,
            artist: i.author || 'YouTube Artist',
            id: i.videoId,
            thumb: `https://img.youtube.com/vi/${i.videoId}/hqdefault.jpg`
          }))
        }
      ];

      let songs = null;

      for (const server of servers) {
        try {
          const res = await fetch(server.url(query));
          if (!res.ok) continue;
          const data = await res.json();
          const parsed = server.parse(data);
          if (parsed && parsed.length > 0) {
            songs = parsed;
            break; // Jika berhasil dapat lagu, stop loop server
          }
        } catch (e) {
          console.log('Server sibuk, mencoba server cadangan berikutnya...');
        }
      }

      if (!songs || songs.length === 0) {
        searchResults.innerHTML = '<div style="font-size:12px; color:#ef4444; text-align:center; padding:10px;">Gagal memuat. Coba paste link YT-nya langsung!</div>';
        return;
      }

      searchResults.innerHTML = '';
      songs.slice(0, 5).forEach(item => {
        const div = document.createElement('div');
        div.className = 'result-item';
        div.innerHTML = `
          <img class="result-thumb" src="${item.thumb}" alt="thumb" onerror="this.src='https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=500&q=80'">
          <div class="result-details">
            <div class="result-title">${item.title}</div>
            <div class="result-artist">${item.artist}</div>
          </div>
        `;
        div.onclick = () => selectAndPlaySong(item.title, item.artist, item.id, item.thumb);
        searchResults.appendChild(div);
      });
    }

    function handleSearchKey(e) {
      if (e.key === 'Enter') searchMusic();
    }

    function selectAndPlaySong(title, artist, ytId, cover) {
      const newTrack = { title, artist, ytId, cover };
      playlist.unshift(newTrack);
      currentTrackIndex = 0;
      
      searchResults.style.display = 'none';
      document.getElementById('searchInput').value = '';

      loadTrack(0, true);
    }

    function loadTrack(index, autoPlay = true) {
      if (playlist.length === 0) return;
      const track = playlist[index];
      trackTitle.innerText = track.title;
      trackArtist.innerText = track.artist;
      coverArt.src = track.cover;

      if (ytPlayer && ytPlayer.loadVideoById) {
        if (autoPlay) {
          ytPlayer.loadVideoById(track.ytId);
        } else {
          ytPlayer.cueVideoById(track.ytId);
        }
      }

      updateMediaSession(track);
    }

    function togglePlay() {
      if (!ytPlayer) return;
      const state = ytPlayer.getPlayerState();
      if (state === YT.PlayerState.PLAYING) {
        ytPlayer.pauseVideo();
      } else {
        ytPlayer.playVideo();
      }
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        isPlaying = true;
        playBtn.innerHTML = '<i class="ph-bold ph-pause"></i>';
        coverArt.classList.add('playing');
        startProgressLoop();
      } else {
        isPlaying = false;
        playBtn.innerHTML = '<i class="ph-bold ph-play"></i>';
        coverArt.classList.remove('playing');
        stopProgressLoop();
      }

      if (event.data === YT.PlayerState.ENDED) {
        nextTrack();
      }
    }

    function prevTrack() {
      if (playlist.length === 0) return;
      currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
      loadTrack(currentTrackIndex, true);
    }

    function nextTrack() {
      if (playlist.length === 0) return;
      currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
      loadTrack(currentTrackIndex, true);
    }

    function startProgressLoop() {
      stopProgressLoop();
      progressInterval = setInterval(() => {
        if (ytPlayer && ytPlayer.getCurrentTime) {
          const currentTime = ytPlayer.getCurrentTime() || 0;
          const duration = ytPlayer.getDuration() || 0;

          if (duration > 0) {
            const pct = (currentTime / duration) * 100;
            progressFill.style.width = pct + '%';
            currentTimeEl.innerText = formatTime(currentTime);
            durationEl.innerText = formatTime(duration);
          }
        }
      }, 500);
    }

    function stopProgressLoop() {
      if (progressInterval) clearInterval(progressInterval);
    }

    function seekTrack(e) {
      if (!ytPlayer || !ytPlayer.getDuration) return;
      const rect = e.currentTarget.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const duration = ytPlayer.getDuration();
      ytPlayer.seekTo((clickX / rect.width) * duration, true);
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function updateMediaSession(track) {
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: track.title,
          artist: track.artist,
          album: 'exWann Music',
          artwork: [{ src: track.cover, sizes: '512x512', type: 'image/jpeg' }]
        });

        navigator.mediaSession.setActionHandler('play', () => ytPlayer.playVideo());
        navigator.mediaSession.setActionHandler('pause', () => ytPlayer.pauseVideo());
        navigator.mediaSession.setActionHandler('previoustrack', () => prevTrack());
        navigator.mediaSession.setActionHandler('nexttrack', () => nextTrack());
      }
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW Error:', err));
    }
  </script>
</body>
</html>
