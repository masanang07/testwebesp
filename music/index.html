<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070a11">
  <meta name="description" content="exWann Music - pemutar musik dengan antrean, riwayat, dan Auto-Mix.">
  <link rel="manifest" href="manifest.json">
  <title>exWann Music</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    :root{--bg:#070a11;--panel:#0e1422;--card:rgba(22,31,48,.72);--card-hover:rgba(30,42,66,.9);--border:rgba(255,255,255,.08);--primary:#06b6d4;--accent:#10b981;--text:#f8fafc;--muted:#94a3b8;--player-height:88px}
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh;overflow-x:hidden;padding-bottom:var(--player-height)}
    button,input{font:inherit}button{color:inherit}
    .app-container{width:100%;min-height:calc(100vh - var(--player-height))}
    .main-content{width:100%;max-width:1500px;margin:auto;padding:28px clamp(16px,4vw,56px) 40px;display:flex;flex-direction:column;gap:30px;background:radial-gradient(ellipse at 50% -25%,rgba(6,182,212,.17),transparent 58%)}
    .top-header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
    .brand{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:800;letter-spacing:.2px}.brand i{font-size:30px;color:var(--primary);filter:drop-shadow(0 0 10px rgba(6,182,212,.35))}.brand span em{font-style:normal;color:var(--primary)}
    .search-wrapper{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:7px 9px 7px 15px;width:100%;max-width:560px;backdrop-filter:blur(12px)}
    .search-wrapper:focus-within{border-color:var(--primary)}.search-wrapper>i{color:var(--muted);font-size:19px}.search-wrapper input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--text);font-size:14px;padding:8px 0}.search-wrapper button,.primary-button{border:0;background:linear-gradient(135deg,var(--primary),var(--accent));color:#001014;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer}.search-wrapper button{width:40px;height:40px;padding:0;font-size:19px;display:grid;place-items:center}
    .section{min-width:0}.section-heading{display:flex;align-items:center;gap:10px;margin-bottom:15px}.section-heading>i{font-size:23px;color:var(--primary)}.section-heading h2{font-size:19px;font-weight:800}.section-subtitle{color:var(--muted);font-size:12px;margin-top:3px}.section-heading .count{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
    .results-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:15px}
    .music-card{position:relative;display:flex;flex-direction:column;gap:10px;min-width:0;padding:12px;text-align:left;background:var(--card);border:1px solid var(--border);border-radius:17px;cursor:pointer;transition:background .2s,border-color .2s,transform .2s}.music-card:hover{background:var(--card-hover);border-color:rgba(6,182,212,.35);transform:translateY(-3px)}.card-thumb-wrap{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#111827}.card-thumb{width:100%;height:100%;object-fit:cover}.play-overlay{position:absolute;inset:0;display:grid;place-items:center;background:#0006;opacity:0;transition:opacity .2s}.music-card:hover .play-overlay,.music-card:focus-visible .play-overlay{opacity:1}.play-btn-circle{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;background:var(--primary);color:#001014;font-size:23px}.card-title{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card-artist{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .playlist-table{display:flex;flex-direction:column;gap:7px}.track-row{display:flex;align-items:center;gap:13px;padding:9px 11px;border-radius:13px;background:var(--card);border:1px solid transparent;min-width:0;transition:background .2s,border-color .2s}.track-row:hover,.track-row.active{background:var(--card-hover);border-color:rgba(6,182,212,.24)}.track-row.active .track-row-title{color:var(--primary)}.track-row-thumb{width:48px;height:48px;border-radius:9px;object-fit:cover;flex-shrink:0;background:#111827}.track-row-info{flex:1;min-width:0;cursor:pointer}.track-row-title{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.track-row-artist{font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row-index{width:20px;color:var(--muted);font-size:12px;text-align:center;flex-shrink:0}.row-playing{color:var(--primary);font-size:18px;flex-shrink:0}
    .track-menu-wrap{position:relative;flex-shrink:0}.track-menu-button{width:36px;height:36px;border:0;border-radius:50%;background:transparent;color:var(--muted);font-size:23px;cursor:pointer}.track-menu-button:hover{background:#ffffff12;color:var(--text)}.track-menu{position:absolute;right:0;top:39px;width:210px;padding:6px;background:#151d2d;border:1px solid var(--border);border-radius:12px;box-shadow:0 14px 34px #0008;z-index:200}.track-menu[hidden]{display:none}.track-menu button{display:block;width:100%;padding:11px 10px;border:0;border-radius:8px;text-align:left;background:transparent;font-size:12px;cursor:pointer}.track-menu button:hover{background:#06b6d41c}
    .empty-state,.status-message{padding:20px;border:1px dashed var(--border);border-radius:14px;color:var(--muted);font-size:13px;line-height:1.6}.text-button{margin-left:auto;background:transparent;border:0;color:var(--muted);font-size:12px;cursor:pointer}.text-button:hover{color:var(--primary)}.toggle-wrap{display:flex;align-items:center;gap:8px;margin-left:auto;color:var(--muted);font-size:12px}.toggle-wrap input{accent-color:var(--primary);width:16px;height:16px}
    .player-bar{height:var(--player-height);position:fixed;bottom:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 22px;background:rgba(14,20,34,.96);backdrop-filter:blur(20px);border-top:1px solid var(--border)}.now-playing-left{display:flex;align-items:center;gap:12px;width:28%;min-width:0}.now-playing-cover{width:52px;height:52px;object-fit:cover;border-radius:10px;box-shadow:0 4px 12px #0007;flex-shrink:0}.now-playing-meta{min-width:0}.now-playing-title{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.now-playing-artist{font-size:11px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.player-controls-center{display:flex;flex-direction:column;align-items:center;gap:5px;width:45%;max-width:550px;min-width:0}.control-buttons{display:flex;align-items:center;gap:20px}.btn-action{display:grid;place-items:center;width:32px;height:32px;border:0;background:transparent;color:var(--text);font-size:21px;cursor:pointer}.btn-action:hover{color:var(--primary)}.btn-action-main{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent));color:#001014;font-size:22px}.btn-action-main:hover{color:#001014;transform:scale(1.04)}.progress-bar-wrapper{display:flex;align-items:center;gap:10px;width:100%;font-size:10px;color:var(--muted)}.progress-bar{height:5px;flex:1;border-radius:50px;background:#ffffff20;cursor:pointer;overflow:hidden}.progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:50px}.player-right{display:flex;align-items:center;justify-content:flex-end;gap:10px;width:22%;color:var(--muted);font-size:13px}.player-right i{font-size:20px}#ytPlayerHidden{position:fixed;left:-10000px;top:0;width:200px;height:200px;pointer-events:none}
    .toast{position:fixed;left:50%;bottom:calc(var(--player-height) + 16px);transform:translateX(-50%);z-index:500;padding:11px 16px;border:1px solid var(--border);border-radius:12px;background:#182235;color:var(--text);font-size:12px;box-shadow:0 8px 28px #0008;max-width:calc(100% - 24px)}.toast[hidden]{display:none}
    button:focus-visible,input:focus-visible,.progress-bar:focus-visible{outline:2px solid var(--primary);outline-offset:3px}
    @media(max-width:760px){:root{--player-height:104px}.main-content{padding:18px 12px 30px;gap:25px}.top-header{align-items:stretch}.brand{font-size:18px}.brand i{font-size:26px}.search-wrapper{max-width:none}.results-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.music-card{padding:9px;border-radius:14px}.section-heading h2{font-size:16px}.section-heading{margin-bottom:12px}.player-bar{padding:8px 10px;gap:8px;flex-wrap:wrap;align-content:center}.now-playing-left{width:100%;height:38px;gap:8px;order:0}.now-playing-cover{width:36px;height:36px;border-radius:7px}.now-playing-title{font-size:11px}.now-playing-artist{font-size:10px;margin-top:2px}.player-controls-center{width:100%;max-width:none;order:1;flex-direction:row-reverse;gap:12px}.control-buttons{gap:8px;flex-shrink:0}.btn-action{width:29px;height:29px;font-size:18px}.btn-action-main{width:32px;height:32px;font-size:19px}.progress-bar-wrapper{gap:6px}.player-right{display:none}.track-row{gap:9px;padding:8px}.track-row-thumb{width:42px;height:42px}.row-index{width:15px}.track-menu-button{width:32px;height:32px}.toggle-wrap{font-size:11px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <div class="app-container">
    <main class="main-content">
      <header class="top-header">
        <div class="brand"><i class="ph-bold ph-music-notes"></i><span>exWann <em>Music</em></span></div>
        <form class="search-wrapper" id="searchForm">
          <i class="ph-bold ph-magnifying-glass"></i>
          <input type="search" id="searchInput" placeholder="Cari lagu, artis, atau tempel link YouTube…" autocomplete="off" aria-label="Cari lagu">
          <button type="submit" aria-label="Cari"><i class="ph-bold ph-arrow-right"></i></button>
        </form>
      </header>

      <section class="section" id="resultsSection" hidden>
        <div class="section-heading"><i class="ph-bold ph-magnifying-glass"></i><h2>Hasil Pencarian</h2></div>
        <div id="resultsGrid" class="results-grid"></div>
      </section>

      <section class="section">
        <div class="section-heading"><i class="ph-bold ph-list-plus"></i><div><h2>Antrean Berikutnya</h2><div class="section-subtitle">Lagu yang menunggu untuk diputar</div></div><span class="count" id="queueCount">0 lagu</span></div>
        <div id="playlistContainer" class="playlist-table"></div>
      </section>

      <section class="section">
        <div class="section-heading"><i class="ph-bold ph-clock-counter-clockwise"></i><div><h2>Baru Diputar</h2><div class="section-subtitle">Riwayat pemutaran di perangkat ini</div></div><button id="clearHistoryBtn" class="text-button" type="button">Hapus riwayat</button></div>
        <div id="historyContainer" class="playlist-table"></div>
      </section>

      <section class="section">
        <div class="section-heading"><i class="ph-bold ph-sparkle"></i><div><h2>Auto-Mix</h2><div class="section-subtitle">Rekomendasi saat antrean kosong</div></div><label class="toggle-wrap"><input id="autoMixToggle" type="checkbox" checked> Aktif</label></div>
        <div id="recommendationGrid" class="results-grid"><p class="empty-state">Putar lagu untuk mulai membangun rekomendasi.</p></div>
      </section>
    </main>
  </div>

  <footer class="player-bar">
    <div class="now-playing-left">
      <img id="playerCover" class="now-playing-cover" src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=200&q=80" alt="Sampul lagu">
      <div class="now-playing-meta"><div id="playerTitle" class="now-playing-title">Pilih lagu untuk memutar</div><div id="playerArtist" class="now-playing-artist">exWann Music</div></div>
    </div>
    <div class="player-controls-center">
      <div class="control-buttons">
        <button class="btn-action" id="prevBtn" type="button" aria-label="Lagu sebelumnya"><i class="ph-bold ph-skip-back"></i></button>
        <button id="playBtn" class="btn-action btn-action-main" type="button" aria-label="Putar"><i class="ph-bold ph-play"></i></button>
        <button class="btn-action" id="nextBtn" type="button" aria-label="Lagu berikutnya"><i class="ph-bold ph-skip-forward"></i></button>
      </div>
      <div class="progress-bar-wrapper"><span id="currentTime">0:00</span><div class="progress-bar" id="progressBar" role="slider" tabindex="0" aria-label="Posisi lagu" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="progress-fill" id="progressFill"></div></div><span id="duration">0:00</span></div>
    </div>
    <div class="player-right"><i class="ph-bold ph-speaker-high"></i><span id="playerStatus">Siap diputar</span></div>
  </footer>
  <div id="ytPlayerHidden"></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script>
    'use strict';

    // Masukkan API key YouTube Data API v3 milikmu. Batasi key di Google Cloud.
    const YOUTUBE_API_KEY = 'AIzaSyBG9D2bzuzbJiqe9SzBENZXPAhPYE8mIEU';
    // Gunakan konfigurasi Firebase web milik project testwebesp.
    // Firebase API key bukan pengganti Security Rules.
    const firebaseConfig = {
      apiKey: 'AIzaSyDtLdgk-tExdPeycx6yfdvPSADdqYdbeJ0',
      databaseURL: 'https://testwebesp-default-rtdb.firebaseio.com'
    };

    // Tidak memakai lagu starter agar player tidak bergantung pada ID video bawaan.
    const STARTER_TRACKS = [];
    const MAX_QUEUE = 100;
    const MAX_HISTORY = 100;
    const $ = id => document.getElementById(id);

    let db = null;
    let queueRef = null;
    let currentTrackRef = null;
    let ytPlayer = null;
    let isReady = false;
    let isPlaying = false;
    let isSeeking = false;
    let progressInterval = null;
    let currentTrack = null;
    let queue = [];
    let history = loadLocalHistory();
    let recommendations = [];
    let autoMixEnabled = true;
    let isAdvancing = false;
    let recommendationInProgress = false;
    let lastHistoryId = null;
    let toastTimer = null;
    let lastRemoteCommand = 0;

    const playerCover = $('playerCover');
    const playerTitle = $('playerTitle');
    const playerArtist = $('playerArtist');
    const playBtn = $('playBtn');
    const progressFill = $('progressFill');
    const currentTimeEl = $('currentTime');
    const durationEl = $('duration');
    const resultsSection = $('resultsSection');
    const resultsGrid = $('resultsGrid');
    const playlistContainer = $('playlistContainer');
    const historyContainer = $('historyContainer');
    const recommendationGrid = $('recommendationGrid');

    function showToast(message) {
      const el = $('toast');
      el.textContent = message;
      el.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { el.hidden = true; }, 2800);
    }

    function loadLocalHistory() {
      try {
        const data = JSON.parse(localStorage.getItem('exwann_history') || '[]');
        return Array.isArray(data) ? data.filter(t => normalizeTrack(t)).slice(0, MAX_HISTORY) : [];
      } catch { return []; }
    }

    function saveLocalHistory() {
      try { localStorage.setItem('exwann_history', JSON.stringify(history.slice(0, MAX_HISTORY))); }
      catch (error) { console.warn('Riwayat tidak bisa disimpan:', error); }
    }

    function normalizeTrack(track) {
      if (!track || typeof track.ytId !== 'string' || !/^[\w-]{11}$/.test(track.ytId)) return null;
      return {
        ytId: track.ytId,
        title: String(track.title || 'Tanpa judul').slice(0, 200),
        artist: String(track.artist || 'YouTube').slice(0, 200),
        cover: typeof track.cover === 'string' && track.cover.startsWith('https://')
          ? track.cover
          : `https://img.youtube.com/vi/${track.ytId}/hqdefault.jpg`
      };
    }

    function makeTrack(title, artist, id, cover) {
      return normalizeTrack({title, artist, ytId:id, cover:cover || `https://img.youtube.com/vi/${id}/hqdefault.jpg`});
    }

    function extractYTId(input) {
      if (!input) return null;
      const value = input.trim();
      if (/^[\w-]{11}$/.test(value)) return value;
      try {
        const url = new URL(value);
        const host = url.hostname.toLowerCase().replace(/^www\./, '');
        let id = null;
        if (host === 'youtu.be') id = url.pathname.split('/').filter(Boolean)[0];
        else if (['youtube.com','m.youtube.com','music.youtube.com','youtube-nocookie.com'].includes(host)) {
          id = url.searchParams.get('v');
          if (!id) {
            const parts = url.pathname.split('/').filter(Boolean);
            if (['embed','shorts','live','v'].includes(parts[0])) id = parts[1];
          }
        }
        return id && /^[\w-]{11}$/.test(id) ? id : null;
      } catch { return null; }
    }

    function connectFirebase() {
      if (firebaseConfig.apiKey.startsWith('ISI_')) {
        showToast('Isi API key Firebase dan YouTube di bagian konfigurasi.');
        return;
      }
      try {
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        db = firebase.database();
        queueRef = db.ref('music/queue');
        currentTrackRef = db.ref('music/currentTrack');
        queueRef.on('value', snapshot => {
          const data = snapshot.val();
          const list = Array.isArray(data) ? data : data ? Object.values(data) : [];
          queue = list.map(normalizeTrack).filter(Boolean).slice(0, MAX_QUEUE);
          renderQueue();
        }, error => {
          console.error('Firebase queue listener:', error);
          showToast('Gagal membaca antrean Firebase. Cek Rules database.');
        });
        // Perangkat lain dapat meminta lagu diputar. Update ini berlaku global,
        // jadi bila ingin antrean privat per perangkat, pisahkan path berdasarkan user/device ID.
        currentTrackRef.on('value', snapshot => {
          const remote = snapshot.val();
          if (!remote || typeof remote !== 'object' || !remote.track) return;
          if (remote.commandId && remote.commandId === lastRemoteCommand) return;
          if (remote.commandId) lastRemoteCommand = remote.commandId;
          const track = normalizeTrack(remote.track);
          if (track && isReady) playTrackNow(track, false);
        }, error => console.warn('Firebase current track listener:', error));
      } catch (error) {
        console.error('Firebase init gagal:', error);
        showToast('Firebase gagal terhubung. Aplikasi tetap bisa dipakai lokal.');
      }
    }

    window.onYouTubeIframeAPIReady = function () {
      ytPlayer = new YT.Player('ytPlayerHidden', {
        width:'200', height:'200',
        playerVars:{playsinline:1,controls:0,rel:0,enablejsapi:1},
        events:{
          onReady:() => {
            isReady = true;
            renderQueue(); renderHistory();
            if (STARTER_TRACKS[0]) cueTrack(STARTER_TRACKS[0]);
            $('playerStatus').textContent = 'Siap diputar';
          },
          onStateChange:onPlayerStateChange,
          onError:onPlayerError
        }
      });
    };

    // Callback sudah didefinisikan sebelum YouTube IFrame API dimuat.
    const ytApiScript = document.createElement('script');
    ytApiScript.src = 'https://www.youtube.com/iframe_api';
    ytApiScript.onerror = () => {
      $('playerStatus').textContent = 'YouTube gagal dimuat';
      showToast('API player YouTube gagal dimuat. Cek koneksi atau pemblokir konten.');
    };
    document.head.appendChild(ytApiScript);

    async function searchYoutubeOfficial() {
      const query = $('searchInput').value.trim();
      if (!query) return;
      const directId = extractYTId(query);
      if (directId) {
        $('searchInput').value = '';
        const track = makeTrack('Video YouTube', 'YouTube', directId);
        playTrackNow(track);
        return;
      }
      if (!YOUTUBE_API_KEY || YOUTUBE_API_KEY.startsWith('ISI_')) {
        showSearchResultsMessage('Isi YOUTUBE_API_KEY di bagian konfigurasi terlebih dahulu.');
        return;
      }
      resultsSection.hidden = false;
      showSearchResultsMessage('Sedang mencari di YouTube…');
      try {
        const params = new URLSearchParams({part:'snippet',q:query,type:'video',videoEmbeddable:'true',maxResults:'12',key:YOUTUBE_API_KEY});
        const response = await fetch(`https://www.googleapis.com/youtube/v3/search?${params}`);
        const data = await response.json();
        if (!response.ok || data.error) throw new Error(data.error?.message || `HTTP ${response.status}`);
        const tracks = (data.items || []).filter(item => item.id?.videoId).map(item => makeTrack(
          item.snippet?.title, item.snippet?.channelTitle, item.id.videoId,
          item.snippet?.thumbnails?.high?.url || item.snippet?.thumbnails?.medium?.url
        )).filter(Boolean);
        renderTrackCards(resultsGrid, tracks, 'Tidak ada hasil pencarian.');
        $('searchInput').value = '';
        if (tracks.length) resultsSection.scrollIntoView({behavior:'smooth',block:'start'});
      } catch (error) {
        console.error('Pencarian YouTube gagal:', error);
        showSearchResultsMessage(`Pencarian gagal: ${error.message}`);
      }
    }

    function showSearchResultsMessage(message) {
      resultsSection.hidden = false;
      const p = document.createElement('p'); p.className = 'status-message'; p.textContent = message;
      resultsGrid.replaceChildren(p);
    }

    function renderTrackCards(container, tracks, emptyText) {
      container.replaceChildren();
      if (!tracks.length) {
        const p = document.createElement('p'); p.className = 'empty-state'; p.textContent = emptyText;
        container.appendChild(p); return;
      }
      tracks.forEach(track => {
        const card = document.createElement('button'); card.type = 'button'; card.className = 'music-card';
        const wrap = document.createElement('div'); wrap.className = 'card-thumb-wrap';
        const img = document.createElement('img'); img.className = 'card-thumb'; img.src = track.cover; img.alt = 'Sampul lagu'; img.loading = 'lazy';
        const overlay = document.createElement('div'); overlay.className = 'play-overlay';
        const playIcon = document.createElement('div'); playIcon.className = 'play-btn-circle'; playIcon.innerHTML = '<i class="ph-bold ph-play"></i>';
        overlay.appendChild(playIcon); wrap.append(img, overlay);
        const title = document.createElement('div'); title.className = 'card-title'; title.textContent = track.title;
        const artist = document.createElement('div'); artist.className = 'card-artist'; artist.textContent = track.artist;
        card.append(wrap, title, artist);
        card.addEventListener('click', () => playTrackNow(track));
        card.addEventListener('contextmenu', event => { event.preventDefault(); addToQueue(track); });
        container.appendChild(card);
      });
    }

    function addToQueue(track) {
      const song = normalizeTrack(track); if (!song) return;
      if (queue.length >= MAX_QUEUE) { showToast('Antrean sudah mencapai batas 100 lagu.'); return; }
      queue.push(song); renderQueue(); persistQueue(); showToast(`Ditambahkan ke antrean: ${song.title}`);
    }

    function playNext(track) {
      const song = normalizeTrack(track); if (!song) return;
      if (queue.length >= MAX_QUEUE) { showToast('Antrean sudah mencapai batas 100 lagu.'); return; }
      queue.unshift(song); renderQueue(); persistQueue(); showToast('Lagu ditambahkan untuk diputar berikutnya.');
    }

    function persistQueue() {
      if (queueRef) queueRef.set(queue).catch(error => { console.error(error); showToast('Antrean gagal disimpan ke Firebase.'); });
    }

    function publishCurrentTrack(track) {
      if (currentTrackRef) {
        const commandId = Date.now();
        lastRemoteCommand = commandId; // cegah listener perangkat ini memutar ulang perintahnya sendiri
        currentTrackRef.set({track, commandId}).catch(error => console.warn('Gagal sinkronisasi lagu aktif:', error));
      }
    }

    function renderQueue() {
      playlistContainer.replaceChildren();
      $('queueCount').textContent = `${queue.length} lagu`;
      if (!queue.length) {
        const p = document.createElement('p'); p.className = 'empty-state'; p.textContent = 'Antrean kosong. Tambahkan lagu dari hasil pencarian menggunakan menu ⋮.';
        playlistContainer.appendChild(p); return;
      }
      queue.forEach((track, index) => {
        const row = document.createElement('div'); row.className = 'track-row';
        const number = document.createElement('span'); number.className = 'row-index'; number.textContent = String(index + 1);
        const img = document.createElement('img'); img.className = 'track-row-thumb'; img.src = track.cover; img.alt = 'Sampul'; img.loading = 'lazy';
        const info = document.createElement('div'); info.className = 'track-row-info';
        const title = document.createElement('div'); title.className = 'track-row-title'; title.textContent = track.title;
        const artist = document.createElement('div'); artist.className = 'track-row-artist'; artist.textContent = track.artist;
        info.append(title, artist); info.addEventListener('click', () => playQueuedTrack(index));
        const wrap = document.createElement('div'); wrap.className = 'track-menu-wrap';
        const menuBtn = document.createElement('button'); menuBtn.type = 'button'; menuBtn.className = 'track-menu-button'; menuBtn.textContent = '⋮'; menuBtn.setAttribute('aria-label', `Menu ${track.title}`);
        const menu = document.createElement('div'); menu.className = 'track-menu'; menu.hidden = true;
        const actions = [
          ['Putar sekarang', () => playQueuedTrack(index)],
          ['Putar berikutnya', () => moveQueueTrack(index, 0)],
          ['Pindah ke bawah', () => moveQueueTrack(index, Math.min(queue.length - 1, index + 1))],
          ['Hapus dari antrean', () => removeQueueTrack(index)]
        ];
        actions.forEach(([label, action]) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = label; b.addEventListener('click', e => { e.stopPropagation(); menu.hidden = true; action(); }); menu.appendChild(b); });
        menuBtn.addEventListener('click', e => { e.stopPropagation(); document.querySelectorAll('.track-menu').forEach(m => { if (m !== menu) m.hidden = true; }); menu.hidden = !menu.hidden; });
        wrap.append(menuBtn, menu); row.append(number, img, info, wrap); playlistContainer.appendChild(row);
      });
    }

    function playQueuedTrack(index) {
      if (index < 0 || index >= queue.length) return;
      const [track] = queue.splice(index, 1);
      renderQueue(); persistQueue(); playTrackNow(track);
    }

    function moveQueueTrack(from, to) {
      if (from < 0 || from >= queue.length || to < 0 || to >= queue.length || from === to) return;
      const [track] = queue.splice(from, 1); queue.splice(to, 0, track); renderQueue(); persistQueue();
    }

    function removeQueueTrack(index) {
      if (index < 0 || index >= queue.length) return;
      queue.splice(index, 1); renderQueue(); persistQueue(); showToast('Lagu dihapus dari antrean.');
    }

    function playTrackNow(track, broadcast = true) {
      const song = normalizeTrack(track); if (!song) return;
      if (!isReady || !ytPlayer) { showToast('Player YouTube masih disiapkan. Coba lagi sebentar.'); return; }
      currentTrack = song;
      playerTitle.textContent = song.title; playerArtist.textContent = song.artist; playerCover.src = song.cover;
      $('playerStatus').textContent = 'Memuat lagu…'; resetProgress(); updateMediaSession(song);
      if (broadcast) publishCurrentTrack(song);
      ytPlayer.loadVideoById(song.ytId);
    }

    function cueTrack(track) {
      const song = normalizeTrack(track); if (!song || !ytPlayer) return;
      currentTrack = song; playerTitle.textContent = song.title; playerArtist.textContent = song.artist; playerCover.src = song.cover;
      updateMediaSession(song); ytPlayer.cueVideoById(song.ytId);
    }

    function addHistory(track) {
      const song = normalizeTrack(track); if (!song || lastHistoryId === song.ytId) return;
      lastHistoryId = song.ytId;
      history = [{...song, playedAt:Date.now()}, ...history.filter(item => item.ytId !== song.ytId)].slice(0, MAX_HISTORY);
      saveLocalHistory(); renderHistory();
    }

    function renderHistory() {
      historyContainer.replaceChildren();
      if (!history.length) {
        const p = document.createElement('p'); p.className = 'empty-state'; p.textContent = 'Belum ada lagu yang diputar di perangkat ini.'; historyContainer.appendChild(p); return;
      }
      history.forEach(track => {
        const row = document.createElement('div'); row.className = 'track-row';
        const img = document.createElement('img'); img.className = 'track-row-thumb'; img.src = track.cover; img.alt = 'Sampul'; img.loading = 'lazy';
        const info = document.createElement('div'); info.className = 'track-row-info';
        const title = document.createElement('div'); title.className = 'track-row-title'; title.textContent = track.title;
        const artist = document.createElement('div'); artist.className = 'track-row-artist';
        const date = track.playedAt ? new Date(track.playedAt).toLocaleString('id-ID',{dateStyle:'short',timeStyle:'short'}) : '';
        artist.textContent = date ? `${track.artist} · ${date}` : track.artist;
        info.append(title, artist); info.addEventListener('click', () => playTrackNow(track));
        const wrap = document.createElement('div'); wrap.className = 'track-menu-wrap';
        const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'track-menu-button'; btn.textContent = '⋮'; btn.setAttribute('aria-label', `Menu ${track.title}`);
        const menu = document.createElement('div'); menu.className = 'track-menu'; menu.hidden = true;
        [['Putar sekarang',()=>playTrackNow(track)],['Tambahkan ke antrean',()=>addToQueue(track)],['Putar berikutnya',()=>playNext(track)]].forEach(([label,fn])=>{const b=document.createElement('button');b.type='button';b.textContent=label;b.addEventListener('click',e=>{e.stopPropagation();menu.hidden=true;fn();});menu.appendChild(b);});
        btn.addEventListener('click',e=>{e.stopPropagation();document.querySelectorAll('.track-menu').forEach(m=>{if(m!==menu)m.hidden=true;});menu.hidden=!menu.hidden;});
        wrap.append(btn,menu); row.append(img,info,wrap); historyContainer.appendChild(row);
      });
    }

    async function fetchRecommendations() {
      if (recommendationInProgress) return recommendations;
      if (!YOUTUBE_API_KEY || YOUTUBE_API_KEY.startsWith('ISI_')) return [];
      recommendationInProgress = true;
      try {
        const seed = currentTrack || history[0] || STARTER_TRACKS[0];
        if (!seed) {
          recommendationGrid.replaceChildren();
          const p = document.createElement('p'); p.className = 'empty-state';
          p.textContent = 'Putar lagu terlebih dahulu untuk membangun rekomendasi.';
          recommendationGrid.appendChild(p);
          return [];
        }
        const query = `${seed.artist} lagu resmi`;
        const params = new URLSearchParams({part:'snippet',q:query,type:'video',videoEmbeddable:'true',maxResults:'10',key:YOUTUBE_API_KEY});
        const response = await fetch(`https://www.googleapis.com/youtube/v3/search?${params}`);
        const data = await response.json();
        if (!response.ok || data.error) throw new Error(data.error?.message || `HTTP ${response.status}`);
        const seen = new Set([seed.ytId, ...history.map(t=>t.ytId), ...queue.map(t=>t.ytId)]);
        recommendations = (data.items || []).filter(item=>item.id?.videoId).map(item=>makeTrack(item.snippet?.title,item.snippet?.channelTitle,item.id.videoId,item.snippet?.thumbnails?.high?.url)).filter(t=>t&&!seen.has(t.ytId));
        renderTrackCards(recommendationGrid, recommendations, 'Belum ada rekomendasi.');
        return recommendations;
      } catch (error) {
        console.warn('Rekomendasi gagal:', error);
        recommendationGrid.replaceChildren(); const p=document.createElement('p');p.className='empty-state';p.textContent='Rekomendasi gagal dimuat. Cek API key, kuota, atau koneksi.';recommendationGrid.appendChild(p);return [];
      } finally { recommendationInProgress = false; }
    }

    async function advanceTrack() {
      if (isAdvancing) return;
      isAdvancing = true;
      try {
        if (queue.length) {
          const next = queue.shift(); renderQueue(); await persistQueue();
          playTrackNow(next); return;
        }
        if (!autoMixEnabled) {
          $('playerStatus').textContent = 'Antrean selesai';
          playerTitle.textContent = 'Antrean selesai'; playerArtist.textContent = 'Tambahkan lagu untuk melanjutkan';
          isPlaying = false; resetPlayButton(); return;
        }
        $('playerStatus').textContent = 'Mencari rekomendasi…';
        const tracks = await fetchRecommendations();
        const next = tracks.find(t => !history.some(h=>h.ytId===t.ytId) && !queue.some(q=>q.ytId===t.ytId));
        if (!next) {
          $('playerStatus').textContent = 'Rekomendasi tidak tersedia';
          playerTitle.textContent = 'Auto-Mix belum menemukan lagu'; playerArtist.textContent = 'Tambahkan lagu secara manual'; resetPlayButton(); return;
        }
        // Masukkan rekomendasi ke antrean lalu ambil sebagai lagu aktif.
        queue.push(next); renderQueue(); await persistQueue();
        const selected = queue.shift(); renderQueue(); await persistQueue();
        playTrackNow(selected);
      } finally { isAdvancing = false; }
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        isPlaying = true; $('playerStatus').textContent = 'Sedang diputar';
        playBtn.innerHTML = '<i class="ph-bold ph-pause"></i>'; playBtn.setAttribute('aria-label','Jeda');
        startProgressLoop();
        if (currentTrack) { addHistory(currentTrack); fetchRecommendations(); }
      } else {
        isPlaying = false; resetPlayButton(); stopProgressLoop();
        if (event.data === YT.PlayerState.BUFFERING) $('playerStatus').textContent = 'Memuat…';
        else if (event.data === YT.PlayerState.PAUSED) $('playerStatus').textContent = 'Dijeda';
      }
      if (event.data === YT.PlayerState.ENDED) advanceTrack();
      if (event.data === YT.PlayerState.CUED) { resetProgress(); $('playerStatus').textContent = 'Siap diputar'; }
    }

    function onPlayerError(event) {
      console.warn('YouTube player error:', event.data);
      $('playerStatus').textContent = 'Video tidak bisa diputar';
      showToast('Video tidak tersedia atau dibatasi pemiliknya. Melewati lagu…');
      setTimeout(() => { if (queue.length || autoMixEnabled) advanceTrack(); else { playerTitle.textContent='Video tidak bisa diputar'; playerArtist.textContent='Coba lagu lain'; } }, 350);
    }

    function resetPlayButton() { playBtn.innerHTML = '<i class="ph-bold ph-play"></i>'; playBtn.setAttribute('aria-label','Putar'); }
    function togglePlay() {
      if (!isReady || !ytPlayer) return;
      const state = ytPlayer.getPlayerState();
      if (state === YT.PlayerState.PLAYING) ytPlayer.pauseVideo();
      else if (state === YT.PlayerState.PAUSED || state === YT.PlayerState.CUED) ytPlayer.playVideo();
      else if (currentTrack) ytPlayer.playVideo();
      else if (STARTER_TRACKS[0]) playTrackNow(STARTER_TRACKS[0]);
      else showToast('Cari lagu YouTube terlebih dahulu.');
    }
    function nextTrack() { if (queue.length) { const track=queue.shift();renderQueue();persistQueue();playTrackNow(track); } else advanceTrack(); }
    function prevTrack() {
      if (!isReady || !ytPlayer) return;
      try { if (ytPlayer.getCurrentTime() > 3) { ytPlayer.seekTo(0,true); return; } } catch {}
      const previous = history.find(track => track.ytId !== currentTrack?.ytId);
      if (previous) playTrackNow(previous); else if (currentTrack) ytPlayer.seekTo(0,true);
    }

    function resetProgress() { stopProgressLoop(); progressFill.style.width='0%';currentTimeEl.textContent='0:00';durationEl.textContent='0:00';$('progressBar').setAttribute('aria-valuenow','0'); }
    function startProgressLoop() {
      stopProgressLoop();
      progressInterval=setInterval(()=>{
        if(!ytPlayer||!isReady||isSeeking)return;
        try{
          const current=ytPlayer.getCurrentTime()||0;const duration=ytPlayer.getDuration()||0;const percent=duration>0?Math.min(100,current/duration*100):0;
          currentTimeEl.textContent=formatTime(current);durationEl.textContent=formatTime(duration);progressFill.style.width=`${percent}%`;$('progressBar').setAttribute('aria-valuenow',String(Math.round(percent)));
        }catch(error){console.warn('Progress update gagal:',error);}
      },500);
    }
    function stopProgressLoop(){if(progressInterval!==null){clearInterval(progressInterval);progressInterval=null;}}
    function seekTrack(event){if(!isReady||!ytPlayer)return;const duration=ytPlayer.getDuration()||0;if(!duration)return;const rect=event.currentTarget.getBoundingClientRect();const x=event.clientX ?? rect.left;const ratio=Math.max(0,Math.min(1,(x-rect.left)/rect.width));ytPlayer.seekTo(ratio*duration,true);}
    function formatTime(seconds){const total=Math.max(0,Math.floor(seconds||0));return `${Math.floor(total/60)}:${String(total%60).padStart(2,'0')}`;}

    function updateMediaSession(track) {
      if (!('mediaSession' in navigator) || typeof MediaMetadata === 'undefined') return;
      try {
        navigator.mediaSession.metadata = new MediaMetadata({title:track.title,artist:track.artist,album:'exWann Music',artwork:[{src:track.cover,sizes:'512x512',type:'image/jpeg'}]});
        const handlers={play:togglePlay,pause:()=>{if(ytPlayer&&isReady)ytPlayer.pauseVideo();},previoustrack:prevTrack,nexttrack:nextTrack};
        Object.entries(handlers).forEach(([action,handler])=>{try{navigator.mediaSession.setActionHandler(action,handler);}catch{}});
      } catch(error){console.warn('Media Session tidak tersedia:',error);}
    }

    $('searchForm').addEventListener('submit', event => { event.preventDefault(); searchYoutubeOfficial(); });
    $('playBtn').addEventListener('click',togglePlay);
    $('nextBtn').addEventListener('click',nextTrack);
    $('prevBtn').addEventListener('click',prevTrack);
    $('progressBar').addEventListener('click',seekTrack);
    $('progressBar').addEventListener('keydown',event=>{if(event.key==='ArrowRight'||event.key==='ArrowLeft'){event.preventDefault();if(!ytPlayer||!isReady)return;const duration=ytPlayer.getDuration()||0;const now=ytPlayer.getCurrentTime()||0;ytPlayer.seekTo(Math.max(0,Math.min(duration,now+(event.key==='ArrowRight'?5:-5))),true);}});
    $('clearHistoryBtn').addEventListener('click',()=>{history=[];lastHistoryId=null;saveLocalHistory();renderHistory();showToast('Riwayat perangkat ini dihapus.');});
    $('autoMixToggle').addEventListener('change',event=>{autoMixEnabled=event.target.checked;showToast(`Auto-Mix ${autoMixEnabled?'diaktifkan':'dinonaktifkan'}.`);});
    document.addEventListener('click',event=>{if(!event.target.closest('.track-menu-wrap'))document.querySelectorAll('.track-menu').forEach(menu=>menu.hidden=true);});

    renderQueue();renderHistory();connectFirebase();
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      navigator.serviceWorker.register('./sw.js').catch(error=>console.warn('Service Worker gagal:',error));
    }
  </script>
</body>
