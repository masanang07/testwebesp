<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Home | ESP32 Controller</title>
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Library MQTT (Versi Stabil EMQX) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #090d16;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(34, 197, 94, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(59, 130, 246, 0.08) 0%, transparent 40%);
      color: #f8fafc;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .dashboard-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      padding: 40px 32px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
    }

    .card-header {
      margin-bottom: 24px;
    }

    .badge-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #64748b;
      margin-bottom: 6px;
    }

    .card-title {
      font-size: 24px;
      font-weight: 800;
      color: #ffffff;
    }

    /* Status Connection Pill */
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      border-radius: 100px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 36px;
      transition: all 0.3s ease;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f59e0b;
      box-shadow: 0 0 10px #f59e0b;
      transition: all 0.3s ease;
    }

    /* Status Connected Class */
    .status-pill.connected {
      border-color: rgba(34, 197, 94, 0.3);
      color: #22c55e;
      background: rgba(34, 197, 94, 0.1);
    }
    .status-pill.connected .status-dot {
      background: #22c55e;
      box-shadow: 0 0 12px #22c55e;
    }

    /* Glowing Lamp Container */
    .lamp-wrapper {
      position: relative;
      width: 110px;
      height: 110px;
      margin: 0 auto 40px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .lamp-glow {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #1e293b;
      border: 2px solid rgba(255, 255, 255, 0.05);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.6);
    }

    .lamp-icon {
      position: relative;
      z-index: 2;
      width: 48px;
      height: 48px;
      fill: #475569;
      transition: all 0.4s ease;
    }

    /* KONDISI NYALA (GLOW EFFECT) */
    .lamp-wrapper.on .lamp-glow {
      background: #22c55e;
      border-color: #4ade80;
      box-shadow: 
        0 0 50px rgba(34, 197, 94, 0.6),
        0 0 100px rgba(34, 197, 94, 0.3),
        inset 0 0 20px rgba(255, 255, 255, 0.8);
    }

    .lamp-wrapper.on .lamp-icon {
      fill: #ffffff;
      filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.8));
    }

    /* Action Buttons */
    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .btn-action {
      border: none;
      padding: 16px;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-action:active {
      transform: scale(0.94);
    }

    .btn-on {
      background: #22c55e;
      color: #052e16;
      box-shadow: 0 4px 20px rgba(34, 197, 94, 0.25);
    }

    .btn-on:hover {
      background: #16a34a;
      box-shadow: 0 6px 24px rgba(34, 197, 94, 0.35);
      color: #ffffff;
    }

    .btn-off {
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .btn-off:hover {
      background: #ef4444;
      color: #ffffff;
      box-shadow: 0 6px 24px rgba(239, 68, 68, 0.35);
    }
  </style>
</head>
<body>

  <div class="dashboard-card">
    <div class="card-header">
      <div class="badge-label">MQTT IoT Control</div>
      <h1 class="card-title">ESP32 Device</h1>
    </div>

    <!-- Status Server -->
    <div id="statusPill" class="status-pill">
      <div id="statusDot" class="status-dot"></div>
      <span id="statusText">Connecting...</span>
    </div>

    <!-- Neon Glow Indicator Lampu -->
    <div id="lampWrapper" class="lamp-wrapper">
      <div class="lamp-glow"></div>
      <svg class="lamp-icon" viewBox="0 0 24 24">
        <path d="M12 2A7 7 0 0 0 5 9c0 2.38 1.19 4.47 3 5.74V17a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.26c1.81-1.27 3-3.36 3-5.74a7 7 0 0 0-7-7M9 21a1 1 0 0 0 1 1h4a1 1 0 0 0 1-1v-1H9v1z"/>
      </svg>
    </div>

    <!-- Tombol Kontrol -->
    <div class="controls-grid">
      <button class="btn-action btn-on" onclick="sendControl('ON')">
        NYALA
      </button>
      <button class="btn-action btn-off" onclick="sendControl('OFF')">
        MATI
      </button>
    </div>
  </div>

  <script>
    const TOPIC = 'anang_test_iot/led';
    const BROKER = 'wss://broker.emqx.io:8084/mqtt';

    const statusPill = document.getElementById('statusPill');
    const statusText = document.getElementById('statusText');
    const lampWrapper = document.getElementById('lampWrapper');

    // Buat Client ID unik agar koneksi stabil
    const clientId = 'web_dashboard_' + Math.random().toString(16).substr(2, 8);
    
    // Inisialisasi MQTT Client
    const client = mqtt.connect(BROKER, { clientId: clientId, keepalive: 60 });

    client.on('connect', () => {
      statusText.innerText = 'System Online';
      statusPill.classList.add('connected');
    });

    client.on('error', (err) => {
      statusText.innerText = 'Connection Error';
      statusPill.classList.remove('connected');
      console.error(err);
    });

    client.on('close', () => {
      statusText.innerText = 'Disconnected';
      statusPill.classList.remove('connected');
    });

    function sendControl(state) {
      if (client.connected) {
        // Kirim perintah ke ESP32 via MQTT
        client.publish(TOPIC, state);

        // Ubah efek visual neon di web
        if (state === 'ON') {
          lampWrapper.classList.add('on');
        } else {
          lampWrapper.classList.remove('on');
        }
      } else {
        alert('Belum terhubung ke broker MQTT!');
      }
    }
  </script>
</body>
</html>
