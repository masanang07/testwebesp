<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 Smart Dashboard</title>
  
  <!-- Font Google -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  
  <!-- Library MQTT versi stabil -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 40px 30px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .status-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 35px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #e2e8f0;
      transition: all 0.3s ease;
    }

    .status-text {
      font-size: 13px;
      color: #94a3b8;
      font-weight: 600;
    }

    /* Efek Glow Lampu */
    .lamp-glow {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: #334155;
      margin: 0 auto 35px;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.4s ease;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
    }

    .lamp-glow svg {
      width: 48px;
      height: 48px;
      fill: #64748b;
      transition: all 0.4s ease;
    }

    /* KONDISI LAMPU NYALA */
    .lamp-glow.on {
      background: #22c55e;
      box-shadow: 0 0 40px #22c55e, inset 0 0 15px rgba(255,255,255,0.8);
    }

    .lamp-glow.on svg {
      fill: #ffffff;
    }

    /* Tombol Control */
    .btn-group {
      display: flex;
      gap: 15px;
    }

    button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button:active {
      transform: scale(0.95);
    }

    .btn-on {
      background: #22c55e;
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(34, 197, 94, 0.3);
    }

    .btn-off {
      background: #ef4444;
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
    }

    button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="title">ESP32 Controller</div>
    
    <div class="status-container">
      <div id="dot" class="status-dot"></div>
      <span id="status" class="status-text">Connecting...</span>
    </div>

    <!-- Visual Lampu -->
    <div id="lamp" class="lamp-glow">
      <svg viewBox="0 0 24 24">
        <path d="M12 2A7 7 0 0 0 5 9c0 2.38 1.19 4.47 3 5.74V17a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.26c1.81-1.27 3-3.36 3-5.74a7 7 0 0 0-7-7M9 21a1 1 0 0 0 1 1h4a1 1 0 0 0 1-1v-1H9v1z"/>
      </svg>
    </div>

    <div class="btn-group">
      <button class="btn-on" onclick="sendControl('ON')">NYALA</button>
      <button class="btn-off" onclick="sendControl('OFF')">MATI</button>
    </div>
  </div>

  <script>
    const TOPIC = 'anang_test_iot/led';
    const BROKER = 'wss://broker.hivemq.com:8884/mqtt';

    const statusText = document.getElementById('status');
    const statusDot = document.getElementById('dot');
    const lamp = document.getElementById('lamp');

    // Koneksi ke HiveMQ
    const client = mqtt.connect(BROKER);

    client.on('connect', () => {
      statusText.innerText = 'Online / Terhubung';
      statusText.style.color = '#22c55e';
      statusDot.style.background = '#22c55e';
      statusDot.style.boxShadow = '0 0 10px #22c55e';
    });

    client.on('error', (err) => {
      statusText.innerText = 'Gagal Konek Server';
      statusText.style.color = '#ef4444';
      statusDot.style.background = '#ef4444';
      console.error(err);
    });

    function sendControl(state) {
      if (client.connected) {
        // Kirim sinyal MQTT ke ESP32
        client.publish(TOPIC, state);

        // Ubah tampilan visual di web
        if (state === 'ON') {
          lamp.classList.add('on');
        } else {
          lamp.classList.remove('on');
        }
      } else {
        alert('Belum terhubung ke server MQTT!');
      }
    }
  </script>
</body>
</html>
