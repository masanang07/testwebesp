<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>exWann Music Player</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#070a12">

  <!-- Google Fonts & Phosphor Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <style>
    :root {
      --bg-dark: #070a12;
      --card-bg: rgba(15, 23, 42, 0.85);
      --border-color: rgba(255, 255, 255, 0.1);
      --primary-cyan: #06b6d4;
      --accent-green: #10b981;
      --text-muted: #94a3b8;
      --text-main: #f8fafc;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 20% 20%, rgba(6, 182, 212, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(16, 185, 129, 0.12) 0%, transparent 50%);
      color: var(--text-main);
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .player-card {
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      border: 1px solid var(--border-color);
      border-radius: 32px;
      padding: 28px 24px;
      width: 100%;
      max-width: 390px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .app-brand {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--primary-cyan);
      margin-bottom: 20px;
    }

    /* Search Box */
    .search-box {
      width: 100%;
      display: flex;
      gap: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 8px 12px;
      margin-bottom: 12px;
      transition: border-color 0.2s;
    }

    .search-box:focus-within {
      border-color: var(--primary-cyan);
    }

    .search-box input {
      flex: 1;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 13px;
      font-family: inherit;
      outline: none;
    }

    .search-box button {
      background: var(--primary-cyan);
      border: none;
      color: #000;
      width: 32px;
      height: 32px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: transform 0.2s;
    }

    .search-box button:active { transform: scale(0.9); }

    /* Hasil Pencarian */
    .search-results {
      width: 100%;
      max-height: 200px;
      overflow-y: auto;
      margin-bottom: 16px;
      display: none;
      flex-direction: column;
      gap: 8px;
      padding-right: 4px;
    }

    .result-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.03);
      padding: 8px 10px;
      border-radius: 12px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background 0.2s, border-color 0.2s;
    }

    .result-item:hover {
      background: rgba(6, 182, 212, 0.1);
      border-color: rgba(6, 182, 212, 0.3);
    }

    .result-thumb {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      object-fit: cover;
    }

    .result-details {
      flex: 1;
      overflow: hidden;
    }

    .result-title {
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .result-artist {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Player Interface */
    .cover-art-container {
      position: relative;
      width: 180px;
      height: 180px;
      margin-bottom: 20px;
    }

    .cover-art {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      animation: spin 20s linear infinite;
      animation-play-state: paused;
    }

    .cover-art.playing { animation-play-state: running; }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .track-info {
      text-align: center;
      margin-bottom: 16px;
      width: 100%;
    }

    .track-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .progress-container {
      width: 100%;
      margin-bottom: 20px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 100px;
      cursor: pointer;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary-cyan), var(--accent-green));
      border-radius: 100px;
      transition: width 0.1s linear;
    }

    .time-stamps {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 8px;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      width: 100%;
    }

    .btn-ctrl {
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 24px;
      cursor: pointer;
      transition: transform 0.2s ease, color 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-ctrl:active { transform: scale(0.9); }
    .btn-ctrl:hover { color: var(--primary-cyan); }

    .btn-play {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary-cyan), var(--accent-green));
      color: #000;
      font-size: 28px;
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.4);
    }

    .btn-play:hover {
      color: #000;
      transform: scale(1.05);
    }

    #ytPlayerHidden {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="player-card">
    <div class="app-brand">exWann Music</div>

    <!-- Search Box -->
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Cari judul lagu di YouTube..." onkeypress="handleSearchKey(event)">
      <button onclick="searchYoutubeDirect()"><i class="ph-bold ph-magnifying-glass"></i></button>
    </div>

    <!-- Hasil Pencarian YT Direct -->
    <div id="searchResults" class="search-results"></div>

    <div class="cover-art-container">
      <img id="coverArt" class="cover-art" src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=500&q=80" alt="Album Cover">
    </div>

    <div class="track-info">
      <div id="trackTitle" class="track-title">Cari lagu di atas ☝️</div>
      <div id="trackArtist" class="track-artist">exWann Audio</div>
    </div>

    <div class="progress-container">
      <div class="progress-bar-bg" id="progressBar" onclick="seekTrack(event)">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="time-stamps">
        <span id="currentTime">0:00</span>
        <span id="duration">0:00</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn-ctrl" onclick="prevTrack()"><i class="ph-bold ph-skip-back"></i></button>
      <button id="playBtn" class="btn-ctrl btn-play" onclick="togglePlay()"><i class="ph-bold ph-play"></i></button>
      <button class="btn-ctrl" onclick="nextTrack()"><i class="ph-bold ph-skip-forward"></i></button>
    </div>
  </div>

  <div id="ytPlayerHidden"></div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    let playlist = [
      {
        title: "Membasuh",
        artist: "Hindia",
        ytId: "u_qN2C50K6E",
        cover: "https://img.youtube.com/vi/u_qN2C50K6E/hqdefault.jpg"
      }
    ];

    let currentTrackIndex = 0;
    let ytPlayer = null;
    let isPlaying = false;
    let progressInterval = null;

    const coverArt = document.getElementById('coverArt');
    const trackTitle = document.getElementById('trackTitle');
    const trackArtist = document.getElementById('trackArtist');
    const playBtn = document.getElementById('playBtn');
    const progressFill = document.getElementById('progressFill');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');
    const searchResults = document.getElementById('searchResults');

    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('ytPlayerHidden', {
        height: '100',
        width: '100',
        videoId: playlist[0].ytId,
        playerVars: { 'playsinline': 1, 'controls': 0 },
        events: {
          'onReady': () => loadTrack(0, false),
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function extractYTId(url) {
      if (!url) return null;
      if (url.length === 11 && !url.includes('/')) return url;
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    // Engine Pencarian Langsung dari Situs YouTube
    async function searchYoutubeDirect() {
      const query = document.getElementById('searchInput').value.trim();
      if (!query) return;

      // Cek jika input berupa link direct YT
      const directId = extractYTId(query);
      if (directId) {
        searchResults.style.display = 'none';
        document.getElementById('searchInput').value = '';
        selectAndPlaySong("Lagu YouTube", "exWann Music", directId, `https://img.youtube.com/vi/${directId}/hqdefault.jpg`);
        return;
      }

      searchResults.style.display = 'flex';
      searchResults.innerHTML = '<div style="font-size:12px; color:var(--primary-cyan); text-align:center; padding:10px;">Mencari di YouTube...</div>';

      try {
        const ytSearchUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`;
        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(ytSearchUrl)}`;

        const res = await fetch(proxyUrl);
        const data = await res.json();
        const html = data.contents;

        let songs = [];

        // Parse JSON ytInitialData bawaan YouTube
        const match = html.match(/ytInitialData\s*=\s*({.+?});<\/script>/);
        if (match) {
          const ytData = JSON.parse(match[1]);
          const contents = ytData.contents?.twoColumnSearchResultsRenderer?.primaryContents?.sectionListRenderer?.contents;

          if (contents) {
            for (const sec of contents) {
              const list = sec.itemSectionRenderer?.contents;
              if (list) {
                for (const item of list) {
                  if (item.videoRenderer) {
                    const v = item.videoRenderer;
                    const vId = v.videoId;
                    const vTitle = v.title?.runs[0]?.text || "Judul Lagu";
                    const vArtist = v.ownerText?.runs[0]?.text || "YouTube";
                    const vThumb = `https://img.youtube.com/vi/${vId}/hqdefault.jpg`;

                    if (vId) {
                      songs.push({ id: vId, title: vTitle, artist: vArtist, thumb: vThumb });
                    }
                  }
                }
              }
            }
          }
        }

        // Fallback Regex jika JSON Parse gagal
        if (songs.length === 0) {
          const regex = /"videoId":"([a-zA-Z0-9_-]{11})"/g;
          const ids = [];
          let m;
          while ((m = regex.exec(html)) !== null) {
            if (!ids.includes(m[1])) ids.push(m[1]);
          }
          songs = ids.slice(0, 5).map(id => ({
            id: id,
            title: `Lagu YouTube (${id})`,
            artist: "exWann Audio",
            thumb: `
